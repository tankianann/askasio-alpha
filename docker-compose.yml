services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rag_app
      MYSQL_USER: rag_user
      MYSQL_PASSWORD: rag_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - rag_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rag_mysql_data:
